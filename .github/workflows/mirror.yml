name: Sync Development Branch to Personal Repo

on:
  push:
    branches:
      - Development

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout org repo
        uses: actions/checkout@v4

      - name: Push to personal repo
        run: |
          git config --global user.name "ArnavSingh04"
          git config --global user.email "arnavsingh.sethi@example.com"

          git remote add personal https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/ArnavSingh04/mhp_website.git

          git push personal Development:Development --force