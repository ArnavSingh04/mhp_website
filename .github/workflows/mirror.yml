name: Mirror Dev → Personal Main

on:
  push:
    branches:
      - Development

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Development
        uses: actions/checkout@v4

      - name: Setup Git identity
        run: |
          git config --global user.name "ArnavSingh04"
          git config --global user.email "arnavsingh.sethi@gmail.com"

      - name: Push Development → master (personal repo)
        run: |
          git remote add mirror https://${{ secrets.PERSONAL_TOKEN }}@github.com/ArnavSingh04/mhp_website.git
          git push mirror HEAD:master --force