name: Mirror Dev → Personal Main

on:
  push:
    branches:
      - Development

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Development
        uses: actions/checkout@v4

      - name: Setup Git identity
        run: |
          git config --global user.name "ArnavSingh04"
          git config --global user.email "arnavsingh.sethi@gmail.com"

      - name: Push Development → main (personal repo)
        run: |
          git remote add mirror https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/ArnavSingh04/mhp_website.git
          
          # Push current branch (Development) to main in personal repo
          git push mirror HEAD:main --force